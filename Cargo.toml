[package]
name = "homestock"
version = "0.1.0"
edition = "2021"

[dependencies]
axum        = { version = "0.8", features = ["multipart", "macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
axum-extra  = { version = "0.12", features = ["cookie"] }
tokio       = { version = "1", features = ["rt", "macros", "signal", "time", "fs"] }
tower-http  = { version = "0.7", features = ["fs", "compression-gzip", "limit", "trace", "set-header"] }
rusqlite    = { version = "0.40", features = ["bundled", "backup"] }
askama      = "0.16"
serde       = { version = "1", features = ["derive"] }
toml        = "1.1"
argon2      = "0.6"
rand        = "0.10"
base64      = "0.23"
sha2        = "0.11"
hex         = "0.4"
strsim      = "0.11"
csv         = "1"
image       = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
