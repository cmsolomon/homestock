bind = "0.0.0.0:8443"
tls_cert = "/etc/homestock/certs/cert.pem"
tls_key = "/etc/homestock/certs/key.pem"
data_dir = "/var/lib/homestock"
database_path = "/var/lib/homestock/homestock.sqlite3"
session_days = 30
cookie_secure = true

# Reverse proxies whose X-Forwarded-For header is trusted for the client address, e.g. HAProxy
# on OPNsense doing TLS offloading (enable its X-Forwarded-For option). Without this, every
# request behind the proxy shares one wrong-password limit. List only proxy addresses, and
# firewall the app port so clients can reach it only through them.
# trusted_proxies = ["10.0.10.1"]

[backup]
idle_secs = 300
min_interval_secs = 1800
max_interval_secs = 86400
pending_keep = 3
