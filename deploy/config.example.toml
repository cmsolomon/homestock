bind = "0.0.0.0:8443"
tls_cert = "/etc/homestock/certs/cert.pem"
tls_key = "/etc/homestock/certs/key.pem"
data_dir = "/var/lib/homestock"
database_path = "/var/lib/homestock/homestock.sqlite3"
session_days = 30
cookie_secure = true

[backup]
idle_secs = 300
min_interval_secs = 1800
max_interval_secs = 86400
pending_keep = 3
