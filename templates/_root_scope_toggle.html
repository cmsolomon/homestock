<div class="flex items-center justify-between gap-3 border-t border-line pt-4">
  <div class="flex items-center gap-3">
    <span class="text-[13px] font-medium text-ink-2">Show items:</span>
    <div class="inline-flex rounded-full border border-line-strong bg-surface p-1">
      <button type="button" aria-pressed="{% if nested %}false{% else %}true{% endif %}"
              hx-get="/loc/contents?scope=level" hx-target="#root-contents" hx-push-url="/loc?scope=level"
              class="h-9 rounded-full px-3 font-semibold whitespace-nowrap {% if !nested %}bg-accent text-accent-fg{% else %}text-ink-2{% endif %}">This level</button>
      <button type="button" aria-pressed="{% if nested %}true{% else %}false{% endif %}"
              hx-get="/loc/contents?scope=nested" hx-target="#root-contents" hx-push-url="/loc"
              class="h-9 rounded-full px-3 font-semibold whitespace-nowrap {% if nested %}bg-accent text-accent-fg{% else %}text-ink-2{% endif %}">Nested</button>
    </div>
  </div>
</div>
