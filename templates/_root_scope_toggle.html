<div class="flex items-center justify-between gap-3 border-t border-line pt-4">
  <span class="text-[13px] font-medium text-ink-2">Show nested items</span>
  <button type="button" role="switch" aria-checked="{% if nested %}true{% else %}false{% endif %}"
          hx-get="/loc/contents?scope={% if nested %}level{% else %}nested{% endif %}"
          hx-target="#root-contents" hx-push-url="/loc{% if nested %}?scope=level{% endif %}"
          class="inline-flex h-10 items-center gap-2 rounded-full border border-line-strong bg-surface px-3 font-semibold whitespace-nowrap">
    <span class="size-4 rounded-full {% if nested %}bg-accent{% else %}bg-line-strong{% endif %}"></span>
    {% if nested %}On{% else %}Off{% endif %}
  </button>
</div>
