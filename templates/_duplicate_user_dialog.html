<div class="fixed inset-0 z-40 grid items-end bg-scrim sm:place-items-center" onclick="if(event.target===this) closeSheet()">
  <section role="dialog" aria-modal="true" aria-labelledby="duplicate-user-title" class="w-full rounded-t-[24px] bg-surface p-5 sm:max-w-[480px] sm:rounded-[24px]">
    <div class="mx-auto mb-4 h-[5px] w-10 rounded-full bg-line-strong sm:hidden"></div>
    <h2 id="duplicate-user-title" class="text-lg font-bold">Name already in use</h2>
    <p class="mt-2 text-sm text-ink-2">That user name is already taken. Choose a unique name, including for deleted users.</p>
    <button type="button" onclick="closeSheet()" class="mt-5 h-12 w-full rounded-btn bg-accent font-semibold text-accent-fg whitespace-nowrap">Close</button>
  </section>
</div>
