<div class="fixed inset-0 z-40 grid items-end bg-scrim sm:place-items-center" onclick="if(event.target===this) closeSheet()">
  <section role="dialog" aria-modal="true" aria-labelledby="share-title" class="w-full rounded-t-[24px] bg-surface p-5 sm:max-w-[480px] sm:rounded-[24px]">
    <div class="mx-auto mb-4 h-[5px] w-10 rounded-full bg-line-strong sm:hidden"></div>
    <h2 id="share-title" class="text-lg font-bold">Share shopping list</h2>
    <p class="mt-1 text-sm text-ink-2">{{ items.len() }} items as plain text — email it, or copy and paste anywhere.</p>
    <ul id="share-items" hidden>{% for item in items %}<li data-name="{{ item.name }}" data-qty="{{ item.qty }}" data-unit="{{ item.unit }}" data-location="{{ item.location }}"></li>{% endfor %}</ul>
    <span id="share-date" hidden>{{ date }}</span>
    <label class="mt-4 flex items-center gap-2 text-sm"><input id="share-locations" type="checkbox" onchange="toggleShareLocations()" class="size-5 accent-accent"> Include where each item goes</label>
    <textarea id="share-preview" readonly rows="8" class="mt-3 w-full rounded-btn border border-line-strong bg-bg p-3 font-mono text-sm"></textarea>
    <a id="share-email" href="mailto:?subject=Shopping%20list" class="mt-3 grid h-12 place-items-center rounded-btn border border-line-strong font-semibold whitespace-nowrap">Email list</a>
    <button onclick="copyText(document.getElementById('share-preview').value).then(() => closeSheet())" class="mt-2 h-12 w-full rounded-btn bg-accent font-semibold text-accent-fg whitespace-nowrap">Copy text</button>
    <script>
      function toggleShareLocations() {
        const include = document.getElementById('share-locations').checked;
        const rows = [...document.querySelectorAll('#share-items li')];
        const lines = rows.map(row => `☐ ${row.dataset.name} — ${row.dataset.qty} ${row.dataset.unit}${include && row.dataset.location ? ` (→ ${row.dataset.location})` : ''}`);
        const text = `Shopping list · ${document.getElementById('share-date').textContent}\n\n${lines.join('\n')}\n\nSent from Homestock`;
        document.getElementById('share-preview').value = text;
        document.getElementById('share-email').href = `mailto:?subject=Shopping%20list&body=${encodeURIComponent(text)}`;
      }
      toggleShareLocations();
    </script>
  </section>
</div>
