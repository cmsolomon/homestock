<div class="fixed inset-0 z-40 grid items-end bg-scrim sm:place-items-center" onclick="if(event.target===this) closeSheet()">
  <section role="dialog" aria-modal="true" aria-labelledby="new-user-password-title" class="w-full rounded-t-[24px] bg-surface p-5 sm:max-w-[480px] sm:rounded-[24px]">
    <div class="mx-auto mb-4 h-[5px] w-10 rounded-full bg-line-strong sm:hidden"></div>
    <h2 id="new-user-password-title" class="text-lg font-bold">Temporary password for {{ name }}</h2>
    <p class="mt-2 text-sm text-ink-2">Share in person. They’ll be asked to choose their own at first sign in.</p>
    <p class="my-5 select-all rounded-xl bg-surface-2 p-4 text-center font-mono text-2xl font-bold">{{ password }}</p>
    <button type="button" onclick="closeSheet()" class="h-12 w-full rounded-btn bg-accent font-semibold text-accent-fg whitespace-nowrap">Done</button>
  </section>
</div>
