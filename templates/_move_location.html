<div class="fixed inset-0 z-40 grid items-end bg-scrim sm:place-items-center" onclick="if(event.target===this) closeSheet()">
  <section role="dialog" aria-modal="true" aria-labelledby="move-location-title" class="w-full rounded-t-[24px] bg-surface p-5 sm:max-w-[480px] sm:rounded-[24px]">
    <div class="mx-auto mb-4 h-[5px] w-10 rounded-full bg-line-strong sm:hidden"></div>
    <h2 id="move-location-title" class="text-lg font-bold">Move {{ name }}</h2>
    <p class="mt-1 text-sm text-ink-2">Everything inside the box moves with it.</p>
    <form method="post" action="/loc/{{ id }}/move" class="mt-4 flex flex-col gap-3">
      <input type="hidden" name="current" value="{{ current }}">
      <input type="hidden" name="scope" value="{{ scope }}">
      <label class="flex flex-col gap-1.5 font-medium">Destination
        <select name="parent" required class="h-[52px] rounded-btn border border-line-strong bg-bg px-3 text-base">
          {% for destination in destinations %}<option value="{{ destination.id }}" {% if destination.disabled %}disabled{% endif %}>{{ destination.name }}</option>{% endfor %}
        </select>
      </label>
      <div class="flex gap-2"><button class="h-12 flex-1 rounded-btn bg-accent text-accent-fg font-semibold whitespace-nowrap">Move box</button><button type="button" onclick="closeSheet()" class="h-12 px-4 rounded-btn border border-line-strong whitespace-nowrap">Cancel</button></div>
    </form>
  </section>
</div>
